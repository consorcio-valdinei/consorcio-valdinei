<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consórcio Ademicon | Valdinei</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f7f7;
  color:#222;
  line-height:1.5;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

header{
  background:#fff;
  text-align:center;
  padding:25px 15px 30px;
  border-bottom:4px solid #e21d25;
}

.logo{
  max-width:230px;
  width:70%;
  height:auto;
  margin-bottom:15px;
}

h1{
  color:#c9151d;
  font-size:clamp(30px,7vw,58px);
  line-height:1.05;
  font-weight:900;
  margin:10px 0 15px;
}

.subtitle{
  max-width:850px;
  margin:auto;
  font-size:18px;
  color:#444;
}

.badges{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin-top:22px;
}

.badge{
  background:#fff;
  border:2px solid #e21d25;
  color:#b51219;
  padding:9px 15px;
  border-radius:30px;
  font-weight:bold;
  font-size:14px;
}

section{
  margin:25px 0;
}

.section-title{
  text-align:center;
  color:#c9151d;
  font-size:28px;
  font-weight:900;
  margin-bottom:18px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:18px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
  border-top:5px solid #e21d25;
}

.card h3{
  color:#c9151d;
  font-size:22px;
  margin-bottom:12px;
}

.card p{
  color:#444;
  margin-bottom:10px;
}

.illustration{
  text-align:center;
  font-size:65px;
  margin-bottom:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  overflow:hidden;
  border-radius:12px;
  margin-top:12px;
}

th{
  background:#c9151d;
  color:white;
  padding:12px 8px;
  font-size:15px;
}

td{
  background:#fff;
  padding:11px 8px;
  text-align:center;
  border:1px solid #ddd;
  font-size:15px;
}

td strong{
  color:#b51219;
}

.note{
  font-size:12px;
  color:#666;
  margin-top:8px;
}

.uses{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
